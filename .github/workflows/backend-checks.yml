name: Backend checks
on:
  workflow_call:
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-checks.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: musichub_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TZ: UTC
      GIN_MODE: release
      TEST_DATABASE_URL: postgresql://postgres:test-password@127.0.0.1:5432/musichub_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go mod verify
      - run: touch .env
      - run: go test ./...
      - run: go vet ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
